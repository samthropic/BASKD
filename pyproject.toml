[project]
name = "baskd"
version = "0.1.0a1"
description = "BASK'D: a small calendar service (FastAPI) backed by a real calendar provider (Google Calendar)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "google-auth-httplib2>=0.2",
    "httplib2>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx2>=2.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baskd"]

[tool.uv]
# The lockfile (uv.lock) pins every dependency exactly; `uv sync --locked` reproduces it.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: talks to the real calendar provider (skipped unless credentials are configured)",
]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:baskd.*"]

[tool.coverage.run]
source = ["baskd"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF018"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["baskd"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google.*",
    "google_auth_httplib2",
    "httplib2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Google SDKs ship without type hints; this is the one module allowed to call them.
module = ["baskd.providers.google"]
disallow_untyped_calls = false
